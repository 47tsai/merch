name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [merch-mutation]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Sync generated version metadata
        run: npm run version:sync
      - name: Verify CI contract
        run: npm run verify:ci-contract
      - name: Verify data layout and integrity
        run: npm run verify
      - name: Verify Item schema contract
        run: npm run verify:schema
      - name: Verify legacy runtime fields are absent
        run: npm run verify:legacy-fields
      - name: Verify category contract
        run: npm run verify:category
      - name: Verify image contract
        run: npm run verify:images
      - name: Verify validation boundary contract
        run: npm run verify:validation
      - name: Verify worker validation contract
        run: npm run verify:worker-validation
      - name: Verify management schema contract
        run: npm run verify:management-schema
      - name: Verify works management CRUD contract
        run: npm run verify:works-management
      - name: Verify lifecycle contract
        run: npm run verify:lifecycle
      - name: Verify worker architecture
        run: npm run verify:worker
      - name: Verify Worker authorization and deployment boundaries
        run: npm run verify:worker-boundaries
      - name: Verify Worker runtime failure behavior
        run: npm run verify:worker-runtime
      - name: Verify worker write scope
        run: npm run verify:worker-scope
      - name: Verify worker target read scope
        run: npm run verify:worker-read
      - name: Verify search contract
        run: npm run verify:search
      - name: Verify category search contract
        run: npm run verify:category-search
      - name: Verify statistics contract
        run: npm run verify:statistics
      - name: Verify statistics category contract
        run: npm run verify:statistics-category
      - name: Verify Home contract
        run: npm run verify:home
      - name: Verify Home category contract
        run: npm run verify:home-category
      - name: Verify Home ranking contract
        run: npm run verify:home-ranking
      - name: Verify statistics arithmetic
        run: npm run verify:statistics-arithmetic
      - name: Verify statistics date boundaries
        run: npm run verify:statistics-date-boundaries
      - name: Verify statistics date boundary transitions
        run: npm run verify:statistics-date-boundary-transitions
      - name: Verify statistics category boundary transitions
        run: npm run verify:statistics-category-boundary-transitions
      - name: Verify works statistics contract
        run: npm run verify:works-statistics
      - name: Verify works statistics date boundaries
        run: npm run verify:works-statistics-date-boundaries
      - name: Verify works statistics date boundary transitions
        run: npm run verify:works-statistics-date-boundary-transitions
