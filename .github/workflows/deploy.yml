name: Deploy


on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: pages
  cancel-in-progress: true


jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Wait for Verify result
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Manual deployment is only allowed from main."
              echo "verified=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target_sha="${{ github.sha }}"
            runs=$(gh api "repos/${{ github.repository }}/actions/workflows/verify.yml/runs?head_sha=$target_sha&per_page=100")
            verified=$(echo "$runs" | jq -r --arg sha "$target_sha" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | length')
            echo "Successful Verify runs for $target_sha on main: $verified"
            if [ "$verified" -gt 0 ]; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
            else
              echo "verified=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi


          run_id="${{ github.event.workflow_run.id }}"
          # Wait up to 10 minutes for the Verify run: the suite grew past
          # 5 minutes as runtime tests were added.
          for attempt in {1..60}; do
            status=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.conclusion')
            echo "Verify run $run_id: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "verified=true" >> "$GITHUB_OUTPUT"
              else
                echo "verified=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep 10
          done

