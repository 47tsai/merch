name: Deploy

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Wait for Verify result
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Manual deployment is only allowed from main."
              echo "verified=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target_sha="${{ github.sha }}"
            runs=$(gh api "repos/${{ github.repository }}/actions/workflows/verify.yml/runs?head_sha=$target_sha&per_page=100")
            verified=$(echo "$runs" | jq -r --arg sha "$target_sha" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | length')
            echo "Successful Verify runs for $target_sha on main: $verified"
            if [ "$verified" -gt 0 ]; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
            else
              echo "verified=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          run_id="${{ github.event.workflow_run.id }}"
          for attempt in {1..30}; do
            status=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.conclusion')
            echo "Verify run $run_id: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "verified=true" >> "$GITHUB_OUTPUT"
              else
                echo "verified=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep 10
          done

          echo "Verify did not complete within the wait window."
          echo "verified=false" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.verified == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare credentials
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler@4.151.0 whoami
      - name: Validate Worker GitHub Token
        env:
          MERCH_GITHUB_TOKEN: ${{ secrets.MERCH_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MERCH_GITHUB_TOKEN" ]; then
            echo 'MERCH_GITHUB_TOKEN is not configured.'
            exit 1
          fi
          permissions=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MERCH_GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tsai97216/merch | jq -r '.permissions.push // false')
          if [ "$permissions" != 'true' ]; then
            echo 'MERCH_GITHUB_TOKEN does not have GitHub contents write permission for tsai97216/merch.'
            exit 1
          fi
          echo 'Worker GitHub token has repository write permission.'
      - name: Set Worker GitHub Token
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERCH_GITHUB_TOKEN: ${{ secrets.MERCH_GITHUB_TOKEN }}
        run: printf '%s' "$MERCH_GITHUB_TOKEN" | npx wrangler@4.151.0 secret put GITHUB_TOKEN
      - name: Set Worker Admin Secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERCH_ADMIN_SECRET: ${{ secrets.MERCH_ADMIN_SECRET }}
        run: printf '%s' "$MERCH_ADMIN_SECRET" | npx wrangler@4.151.0 secret put ADMIN_SECRET
      - name: Verify Worker Secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets=$(npx wrangler@4.151.0 secret list --format json)
          echo "$secrets" | jq -e 'map(.name) | index("GITHUB_TOKEN")' >/dev/null
          echo "$secrets" | jq -e 'map(.name) | index("ADMIN_SECRET")' >/dev/null
          echo 'Worker secrets are configured.'
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.151.0 deploy
