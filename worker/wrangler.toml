name = "chi-merch-api"
main = "src/r2-entry.ts"
compatibility_date = "2026-09-07"

routes = [
  { pattern = "merch.chi.qzz.io/api/*", zone_name = "chi.qzz.io" }
]

[vars]
ALLOWED_ORIGIN = "https://merch.chi.qzz.io"
GITHUB_REPO = "47tsai/merch"
GITHUB_BRANCH = "main"
CHI_AUTH_URL = "https://auth.chi.qzz.io"
CHI_AUTH_CLIENT_ID = "T4sJJ0exZ0iiqaL5nrjUly-RU-KgoVp0"

[[r2_buckets]]
binding = "MERCH_ASSETS"
bucket_name = "chi-merch-assets"

[secrets]
required = ["GITHUB_TOKEN"]
